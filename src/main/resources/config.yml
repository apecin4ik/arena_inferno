# ╔══════════════════════════════════════════════════════════════╗
# ║          НЕБЕСНАЯ АРЕНА ИНФЕРНО — конфигурация               ║
# ╚══════════════════════════════════════════════════════════════╝
# Цвета: символ & (например &4 = тёмно-красный, &8 = тёмно-серый).

# ── Расписание ─────────────────────────────────────────────────
schedule:
  timezone: "Europe/Moscow"        # Арена появляется по МОСКОВСКОМУ времени
  times: ["18:00"]                 # можно несколько: ["12:00", "18:00", "23:00"]
  alert-minutes: [120, 60, 30, 1]  # за сколько минут предупреждать в чате

# ── Где появляется ─────────────────────────────────────────────
spawn:
  world: grief-1
  y: 112                           # высота главного приза (шулкера)
  mode: random                     # random = случайная точка, static = всегда одна и та же
  radius-min: -5000
  radius-max: 5000
  static:                          # используется при mode: static
    x: 3928
    z: 1270

# ── Таймеры ────────────────────────────────────────────────────
timers:
  opening-minutes: 5               # через сколько минут после появления шулкер откроется
  close-after-open-minutes: 20     # через сколько минут после открытия Арена исчезнет
  remove-slow-falling-seconds: 30  # игроки, оставшиеся на Арене при исчезновении, плавно падают

# ── Схематика и главный приз ───────────────────────────────────
arena:
  schematic: inferno_sky_arena.schem
  prize-offset: [42, 7, 55]        # позиция шулкера внутри схематики (x, y, z)
  size: [85, 38, 115]              # размер схематики
  hall-inset: 11                   # отступ внутреннего зала от краёв (граница для стражей)
  chest-material-locked: ORANGE_SHULKER_BOX
  chest-material-unlocked: RED_SHULKER_BOX
  inv-name: "&c🔥 &4&lНЕБЕСНЫЙ СУНДУК ИНФЕРНО &c🔥"
  inv-size: 54
  inv-id: inv21499                 # какая секция из inv: ниже используется как лут

# ── Защита ─────────────────────────────────────────────────────
protect:
  break: true                      # нельзя ломать блоки Арены (кроме админов)
  explosions: true                 # взрывы не портят Арену

# ── Границы ────────────────────────────────────────────────────
border:
  keep-guards-inside: true         # стражи не выходят за зал и не падают вниз
  keep-players-inside: false       # true = игроки тоже не могут покинуть Арену

# ── Голограмма над шулкером ────────────────────────────────────
hologram:
  offset-x: 0.5
  offset-y: 2.5
  offset-z: 0.5
  locked:
    - "{name}"
    - "&cПечать нерушима"
    - "&7Падёт через &e{time}"
  open:
    - "{name}"
    - "&4Печать пала"
    - "&7Угаснет через &e{time}"

# ── Стражи Инферно ─────────────────────────────────────────────
# Незеритовая броня (Защита IV), незеритовый меч (Острота V + Заговор огня II), тотем в левой руке.
# Фаза 1: 80 HP, урон 8. Когда «лопается» тотем -> Фаза 2: 60 HP, урон 10.
guards:
  count: 8
  entity-type: WITHER_SKELETON     # можно ZOMBIFIED_PIGLIN, PIGLIN_BRUTE и т.д.
  ring-radius: 14                  # кольцо вокруг шулкера, где они появляются
  name-phase1: "&4&lСтраж Инферно"
  name-phase2: "&4&l&nРазъярённый Страж"
  exp: 40
  phase1:
    health: 80
    damage: 8
  phase2:
    health: 60
    damage: 10

# ── Тексты ─────────────────────────────────────────────────────
messages:
  prefix: "&8[&4Инферно&8] "
  arena-name: "&4&l☠ НЕБЕСНЫЙ СУНДУК ИНФЕРНО ☠"

  alert: "{prefix}&7Небо над миром тлеет... &4Небесная Арена Инферно &7разверзнется через &c{time}&7. &8Готовь клинок и душу."

  spawn:
    - "&8&m                                                    "
    - "&4&l☠ НЕБЕСНАЯ АРЕНА ИНФЕРНО РАЗВЕРЗЛАСЬ ☠"
    - "&7Небеса треснули, и из пустоты вырос &4проклятый чертог&7."
    - "&c▸ &7Координаты: &cX: &f{x} &cY: &f{y} &cZ: &f{z} &8(&7{world}&8)"
    - "&c▸ &7Печать с шулкера падёт через &e{opening} мин&7."
    - "&c▸ &4{guards} Стражей &7ждут тех, кто осмелится войти."
    - "&8&m                                                    "
  opened: "{prefix}&4Печать пала. &7Шулкер &cоткрыт&7. Арена угаснет через &e{close} мин&7. &8Поспеши, пока бездна не закрылась."
  ended: "{prefix}&8Пламя угасло. Небесная Арена Инферно рассыпалась в пепел..."
  prize-locked: "{prefix}&7Печать держит крышку... Подожди ещё &c{time}&7."
  guard-enrage: "&4☠ &cТотем рассыпался в прах — Страж впал в ярость!"
  guards-dead: "{prefix}&7Все &4Стражи &7пали. &8Бездна затаила дыхание."
  border-players: "{prefix}&8Тьма не отпускает тебя с Арены."

  bossbar-locked: "&4&l☠ ИНФЕРНО &8» &cX: &f{x} &cY: &f{y} &cZ: &f{z} &8| &7Печать: &e{time} &8| &4Стражи: &c{guards}"
  bossbar-open: "&5&l☠ ИНФЕРНО &8» &dX: &f{x} &dY: &f{y} &dZ: &f{z} &8| &7Тьма сгустится: &e{time} &8| &4Стражи: &c{guards}"

  status-idle: "&8Арена дремлет в бездне. &7Следующее явление: &c{next} &8(через &7{until}&8)"
  status-locked: "&4Арена пылает! &cX: &f{x} &cY: &f{y} &cZ: &f{z} &8(&7{world}&8) &7Печать падёт через &e{time}"
  status-open: "&4Печать пала! &cX: &f{x} &cY: &f{y} &cZ: &f{z} &8(&7{world}&8) &7Угаснет через &e{time}"

  info:
    - "&8&m                                                    "
    - "&4&l☠ НЕБЕСНАЯ АРЕНА ИНФЕРНО ☠"
    - "&7Над миром, где небеса тлеют, раз в день разверзается"
    - "&7проклятый чертог. Лава шепчет имена павших,"
    - "&7а его Стражи не знают пощады."
    - " "
    - "&c▸ &7Появление: &cкаждый день в &4&l18:00 МСК"
    - "&c▸ &7Главный приз: &cшулкер &7— печать падёт через &e{opening} мин&7,"
    - "&7  после чего Арена тлеет ещё &e{close} мин&7."
    - "&c▸ &7Стражи: &4{guards} &7воинов в незеритовой броне. Берегись &4тотема&7..."
    - " "
    - "&7Статус: {status}"
    - "&8&m                                                    "

  # Эти строки видят ТОЛЬКО игроки с правом inferno.admin
  info-admin:
    - "&4&lКоманды бездны &8(только для избранных)"
    - "&c/arena start &8— &7разжечь Арену сейчас"
    - "&c/arena start here &8— &7разжечь Арену на твоём месте"
    - "&c/arena stop &8— &7погасить Арену"
    - "&c/arena reload &8— &7перечитать конфиг"
    - "&c/arena tp &8— &7шагнуть в бездну (телепорт на Арену)"
    - "&8&m                                                    "

  admin-started: "&8[&4Инферно&8] &7Арена &cразожжена&7."
  admin-stopped: "&8[&4Инферно&8] &7Арена &8погашена&7."
  admin-not-active: "&8[&4Инферно&8] &7Арена сейчас &8не активна&7."
  admin-reloaded: "&8[&4Инферно&8] &7Конфиг &cперечитан&7."
  admin-tp: "&8[&4Инферно&8] &7Ты шагнул в &4бездну&7."
  admin-error: "&8[&4Инферно&8] &cОшибка: &7{error}"
  admin-only-player: "&8[&4Инферно&8] &7Эта команда доступна только игрокам."

